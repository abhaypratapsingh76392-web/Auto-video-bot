name: Auto Daily Video Creator

on:
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install moviepy==1.0.3
          pip install edge-tts
          pip install requests

      - name: Generate Today's Full Video & Webpage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_video.py

      - name: Commit and Push Video & HTML to GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add video_*.mp4 index.html
          git commit -m "Auto-added new AI generated video with download button" || echo "No changes to commit"
          git push
