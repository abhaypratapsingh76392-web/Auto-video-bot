name: Auto Daily Video Generator

on:
  schedule:
    # यह क्रोन जॉब हर दिन सुबह 6 बजे (UTC) रन होगा। आप समय बदल सकते हैं।
    - cron: '0 6 * * *'
  workflow_dispatch: # यह बटन देगा जिससे आप जब चाहें मैन्युअली रन कर सकें

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg (Required for Video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install moviepy==1.0.3
          pip install edge-tts

      - name: Run Video Generation Script
        run: python generate_video.py

      - name: Upload Video as Artifact (To Download)
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Generated-Video
          path: final_video.mp4
