name: Auto Daily Video

on:
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with: 
          python-version: '3.10'
          
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nodejs
        
      - name: Install Python Libraries
        run: pip install edge-tts requests yt-dlp -U
        
      - name: Run Magic Script
        run: python generate_video.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Save to GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add *.mp4 index.html || echo "No new files to add"
          git commit -m "Auto Daily Video Added!" || echo "No changes to commit"
          git push
