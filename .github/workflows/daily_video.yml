name: Make Custom Video

on:
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: 'What should the video be about?'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - name: Install Python Libraries (Including MAGIC Tool)
        run: pip install edge-tts requests yt-dlp
      
      - name: Run Magic Script
        run: python generate_video.py --custom "${{ github.event.inputs.custom_prompt }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      - name: Save to GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add video_custom_*.mp4 index.html
          git commit -m "Custom FULL Video Generated via Magic!" || echo "No changes"
          git push
